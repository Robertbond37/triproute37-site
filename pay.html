<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>결제로 이동 · 고성 가족 마라톤 대회</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF8F4;color:#1B2420;font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all}
.box{max-width:480px;padding:40px 24px;text-align:center}
h1{font-size:22px;margin:0 0 12px}
p{color:#5B665F;line-height:1.7;margin:0 0 20px}
b{color:#EF7A2E}
a.btn{display:inline-block;background:#EF7A2E;color:#fff;text-decoration:none;padding:14px 26px;border-radius:4px;font-weight:700}
.sum{background:#fff;border:1px solid #E6E2DA;border-radius:4px;padding:14px 18px;text-align:left;margin:0 0 20px;font-size:15px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
</style>
</head>
<body>
<div class="box" id="box">
 <h1>결제 화면으로 갑니다</h1>
 <p id="msg">신청서 내용을 확인하는 중입니다…</p>
</div>
<script>
(function(){
 var TEAM={0:'49593727910043',1:'49593727942811',2:'49593727975579',3:'49593728008347'};
 var BUSV={'사당':'49593755599003','잠실':'49593755631771'};
 var BASE=690000,K=37000,BUS=40000;
 var q=new URLSearchParams(location.search);
 var num=function(v){var n=parseInt(String(v||'').replace(/[^0-9]/g,''),10);return isNaN(n)?0:n};
 var k=Math.min(3,num(q.get('k'))), a=num(q.get('a'))||(4-k), n=a+k;
 var busOn=/예|네|yes|true|1|이용/i.test(q.get('bus')||''), from=(q.get('from')||'사당').indexOf('잠실')>=0?'잠실':'사당';
 var course=q.get('course')||'', name=q.get('name')||'', sid=q.get('sid')||'', email=q.get('email')||'';
 var won=function(v){return v.toLocaleString('ko-KR')+'원'};
 var box=document.getElementById('box');
 if(n>4||n<1){box.innerHTML='<h1>인원을 확인해 주세요</h1><p>한 팀은 4명까지입니다. 신청서로 돌아가 인원을 고쳐 주세요.</p><a class="btn" href="/#apply">신청서로</a>';return;}
 var b=busOn?BUS*n:0, total=BASE-K*k+b;
 var items=TEAM[k]+':1'+(busOn?','+BUSV[from]+':'+n:'');
 var attrs='attributes[코스]='+encodeURIComponent(course)+'&attributes[인원]='+encodeURIComponent('어른 '+a+' · 아이 '+k)+(name?'&attributes[대표자]='+encodeURIComponent(name):'')+(sid?'&attributes[신청번호]='+encodeURIComponent(sid):'')+(email?'&checkout[email]='+encodeURIComponent(email):'')+'&note='+encodeURIComponent('고성 가족 마라톤 신청서 접수 · '+course+' · 어른 '+a+' 아이 '+k+(busOn?' · 버스 '+from+' '+n+'명':''));
 var url='https://h110yc-1e.myshopify.com/cart/'+items+'?locale=ko&'+attrs;
 box.innerHTML='<h1>신청서가 접수됐습니다. 이제 결제만 남았습니다.</h1><div class="sum"><div><span>한 팀 (4명까지)</span><span>'+won(BASE)+'</span></div>'+(k?'<div><span>아이 '+k+'명 할인</span><span>−'+won(K*k)+'</span></div>':'')+(busOn?'<div><span>우등버스 '+from+' '+n+'명</span><span>'+won(b)+'</span></div>':'')+'<div><b>합계</b><b>'+won(total)+'</b></div></div><p>3초 뒤 트립루트37 결제 화면으로 넘어갑니다. 안 넘어가면 아래 버튼을 누르세요.</p><a class="btn" href="'+url+'">결제하러 가기 · '+won(total)+'</a>';
 setTimeout(function(){location.href=url},3000);
})();
</script>
</body>
</html>
